
<div class="auth-page"><aside class="auth-side"><a routerLink="/landing" class="auth-brand"><span>S</span> SEOVault</a><div><div class="section-label">WELCOME BACK</div><h1>Your SEO command center.</h1><p>Track website health, crawl pages and turn technical findings into clear next steps.</p></div><div class="proof"><div><b>24/7</b><span>workspace access</span></div><div><b>360°</b><span>SEO visibility</span></div></div></aside>
<main class="auth-main"><div class="auth-card"><div class="section-label">SIGN IN</div><h2>Welcome back</h2><p>Continue where you left off.</p><form (ngSubmit)="login()"><div class="field"><label>USERNAME</label><input [(ngModel)]="form.username" name="username" autocomplete="username" required placeholder="your username"></div><div class="field"><label>PASSWORD</label><input type="password" [(ngModel)]="form.password" name="password" autocomplete="current-password" required placeholder="••••••••"></div><div *ngIf="error" class="error">{{error}}</div><button class="submit" type="submit" [disabled]="isLoading">{{isLoading?'Signing in…':'Sign in to SEOVault →'}}</button></form><div class="auth-switch">New here? <a routerLink="/register">Create an account</a></div></div></main></div>
